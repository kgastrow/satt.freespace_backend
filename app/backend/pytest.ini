[pytest]
# Async configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Test discovery
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Output configuration
addopts = -v --strict-markers --tb=short

# Markers
markers =
    asyncio: mark test as async
    slow: marks tests as slow (deselect with '-m "not slow"')
    benchmark: performance benchmark tests (incompatible with -n auto)
    postgres: needs a real migrated PostgreSQL via TEST_DATABASE_URL_DIRECT (skipped otherwise)

# Parallel execution hints (use with pytest -n auto)
# Each worker gets its own in-memory database
