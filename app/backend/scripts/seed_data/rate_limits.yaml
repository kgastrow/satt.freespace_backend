# API Key Rate Limits per permission
# requests_per_minute: steady-state limit
# burst_limit: max burst above steady rate

# Users - moderate limits, read-heavy expected
- permission_code: users:read
  requests_per_minute: 120
  burst_limit: 150

- permission_code: users:write
  requests_per_minute: 30
  burst_limit: 50

- permission_code: users:delete
  requests_per_minute: 10
  burst_limit: 20

# Roles - administrative, lower frequency
- permission_code: roles:read
  requests_per_minute: 60
  burst_limit: 100

- permission_code: roles:write
  requests_per_minute: 20
  burst_limit: 30

- permission_code: roles:delete
  requests_per_minute: 10
  burst_limit: 15

# User Roles - administrative operations
- permission_code: user_roles:read
  requests_per_minute: 60
  burst_limit: 100

- permission_code: user_roles:assign
  requests_per_minute: 30
  burst_limit: 50

- permission_code: user_roles:revoke
  requests_per_minute: 20
  burst_limit: 30

# Audit Logs - read-only, can be heavy for reports
- permission_code: audit_logs:read
  requests_per_minute: 60
  burst_limit: 100

# Notifications - read-heavy, write moderate
- permission_code: notifications:read
  requests_per_minute: 120
  burst_limit: 200

- permission_code: notifications:write
  requests_per_minute: 60
  burst_limit: 100

- permission_code: notifications:send
  requests_per_minute: 30
  burst_limit: 60

