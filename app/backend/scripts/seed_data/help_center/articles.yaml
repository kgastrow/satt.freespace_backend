- category_slug: getting-started
  title: Welcome to the Platform
  slug: welcome-to-the-platform
  featured_image_url: https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=1200&h=630&fit=crop
  content: |
    # Welcome to the Platform

    Welcome to your new workspace! This guide will help you get started with the key features of the platform.

    ## First Steps

    1. **Complete your profile** - Add your name, photo, and contact information
    2. **Explore the dashboard** - Familiarize yourself with the main navigation
    3. **Configure notifications** - Set your preferences for how you want to be notified
    4. **Invite your team** - If you're an admin, start adding team members

    ## Key Features

    ### Dashboard
    The dashboard provides an overview of your recent activity and quick access to commonly used features.

    ### Sidebar Navigation
    Use the sidebar to navigate between different sections of the application. On mobile devices, tap the menu icon to reveal the navigation.

    ### User Menu
    Click your avatar in the top right to access your profile, settings, and sign out option.

    ## Need Help?

    If you have questions, check out our FAQ section or contact support through the Help Center.

    > **Pro Tip:** Use keyboard shortcuts to navigate faster! Press `?` anywhere to see available shortcuts.

- category_slug: account-profile
  title: Managing Your Profile
  slug: managing-your-profile
  featured_image_url: https://images.unsplash.com/photo-1633332755192-727a05c4013d?w=1200&h=630&fit=crop
  content: |
    # Managing Your Profile

    Your profile contains your personal information and preferences. Here's how to keep it up to date.

    ## Accessing Your Profile

    1. Click your avatar in the top right corner
    2. Select **Profile** from the dropdown menu

    ## Profile Information

    You can update the following information:

    | Field | Description | Required |
    |-------|-------------|----------|
    | First Name | Your given name | Yes |
    | Last Name | Your family name | Yes |
    | Email Address | Primary contact (may require verification) | Yes |
    | Profile Picture | Your avatar image | No |
    | Timezone | For accurate timestamps | No |

    ## Uploading a Profile Picture

    For best results, use an image that:
    - Is at least 200x200 pixels
    - Is in JPG, PNG, or GIF format
    - Shows your face clearly

    ## Connected Accounts

    Link external accounts to enable additional features:

    1. Go to **Settings > Account > Connected Accounts**
    2. Click **Connect** next to the service you want to link
    3. Follow the authorization prompts

    ## Privacy Settings

    Control how your information is displayed to others in **Settings > Security > Privacy**.

    > **Note:** Changes to your email address require verification before taking effect.

