# Default permissions definitions
# Each permission defines access control for a specific action

- code: users:read
  name: View Users
  description: View users in the organization
  display_order: 0

- code: users:write
  name: Manage Users
  description: Create and update users
  display_order: 1

- code: users:delete
  name: Delete Users
  description: Delete users from the organization
  display_order: 2

