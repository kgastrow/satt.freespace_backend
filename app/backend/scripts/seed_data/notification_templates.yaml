- code: security_brute_force_alert
  name: Security Brute Force Alert
  description: Alert sent to super admins when brute force attack is detected
  channel: email
  subject: "Security Alert: Brute Force Attack Detected"
  is_active: true
  variables:
    user_name: string
    event_count: string
    blocked_ips_count: string
    blocked_ips: string
    detection_time: string
  body_text: |
    Hello {user_name},

    SECURITY ALERT: Potential brute force attack detected.

    Detection Summary:
    - Brute Force Events: {event_count}
    - Blocked IP Addresses: {blocked_ips_count}
    - Detection Time: {detection_time}

    Blocked IPs: {blocked_ips}

    Recommended Actions:
    1. Review the authentication logs for suspicious activity
    2. Verify that blocked IPs are not legitimate users
    3. Consider implementing additional security measures
    4. Monitor for continued attack patterns

    This is an automated security notification. You will not receive another alert for 24 hours.

    Best regards,
    System Security
