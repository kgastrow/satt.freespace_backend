- code: queue_health_alert
  name: Queue Health Alert
  description: Alert sent to super admins when queue health issues are detected
  channel: email
  subject: "System Alert: Job Queue Health Issues"
  is_active: true
  variables:
    user_name: string
    queue_depth: string
    stuck_jobs_count: string
    workers_online: string
    workers_offline: string
    issues: string
    detection_time: string
  body_text: |
    Hello {user_name},

    SYSTEM ALERT: Job queue health issues detected.

    Queue Status:
    - Queue Depth: {queue_depth} jobs
    - Stuck Jobs: {stuck_jobs_count}
    - Workers Online: {workers_online}
    - Workers Offline: {workers_offline}
    - Detection Time: {detection_time}

    Issues Detected: {issues}

    Recommended Actions:
    1. Check worker process status and logs
    2. Investigate stuck jobs for errors
    3. Consider scaling up workers if queue depth is high
    4. Review job timeouts and retry policies

    This is an automated notification. You will not receive another alert for 24 hours.

    Best regards,
    System Operations
