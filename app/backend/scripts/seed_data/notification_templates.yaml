# System-wide notification templates

- code: s3_storage_warning
  name: S3 Storage Warning
  description: Alert sent to super admins when S3 storage usage exceeds threshold
  channel: email
  subject: "S3 Storage Alert: Usage at {usage_percent}%"
  is_active: true
  variables:
    user_name: string
    current_bytes: string
    current_gb: string
    total_bytes: string
    total_gb: string
    usage_percent: string
    threshold_percent: string
    bucket_name: string
  body_text: |
    Hello {user_name},

    This is an automated alert regarding S3 storage usage.

    Current Status:
    - Storage Used: {current_gb} GB ({current_bytes} bytes)
    - Total Capacity: {total_gb} GB ({total_bytes} bytes)
    - Usage: {usage_percent}%
    - Alert Threshold: {threshold_percent}% remaining

    Your S3 bucket "{bucket_name}" has exceeded the warning threshold.

    Recommended Actions:
    1. Review and clean up unused or old files
    2. Implement file retention policies
    3. Consider increasing storage capacity
    4. Monitor upload patterns and user activity

    This is an automated notification. You will not receive another alert for 24 hours unless the threshold is crossed again.

    Best regards,
    System Administrator
  body_html: |
    <!DOCTYPE html>
    <html>
    <head>
        <style>
            body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
            .container { max-width: 600px; margin: 0 auto; padding: 20px; }
            .header { background-color: #f44336; color: white; padding: 20px; border-radius: 5px; text-align: center; }
            .content { background-color: #f9f9f9; padding: 20px; border-radius: 5px; margin-top: 20px; }
            .stats { background-color: white; padding: 15px; border-left: 4px solid #f44336; margin: 20px 0; }
            .stats-item { margin: 10px 0; }
            .stats-label { font-weight: bold; color: #666; }
            .actions { background-color: #fff3cd; border-left: 4px solid #ffc107; padding: 15px; margin: 20px 0; }
            .actions h3 { margin-top: 0; color: #856404; }
            .footer { text-align: center; margin-top: 30px; color: #666; font-size: 12px; }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>S3 Storage Alert</h1>
            </div>
            <div class="content">
                <p>Hello {user_name},</p>
                <p>This is an automated alert regarding S3 storage usage.</p>

                <div class="stats">
                    <h3 style="margin-top: 0;">Current Status</h3>
                    <div class="stats-item">
                        <span class="stats-label">Storage Used:</span> {current_gb} GB ({current_bytes} bytes)
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">Total Capacity:</span> {total_gb} GB ({total_bytes} bytes)
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">Usage:</span> <strong>{usage_percent}%</strong>
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">Alert Threshold:</span> {threshold_percent}% remaining
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">Bucket Name:</span> {bucket_name}
                    </div>
                </div>

                <p><strong>Your S3 bucket has exceeded the warning threshold.</strong></p>

                <div class="actions">
                    <h3>Recommended Actions</h3>
                    <ol>
                        <li>Review and clean up unused or old files</li>
                        <li>Implement file retention policies</li>
                        <li>Consider increasing storage capacity</li>
                        <li>Monitor upload patterns and user activity</li>
                    </ol>
                </div>

                <p><em>This is an automated notification. You will not receive another alert for 24 hours unless the threshold is crossed again.</em></p>
            </div>
            <div class="footer">
                <p>This is an automated system notification.</p>
            </div>
        </div>
    </body>
    </html>

