                    <div class="stats-item">
                        <span class="stats-label">Overflow Connections:</span> {overflow}
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">Alert Threshold:</span> {threshold_percent}
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">Detection Time:</span> {detection_time}
                    </div>
                </div>

                <div class="actions">
                    <h3>Recommended Actions</h3>
                    <ol>
                        <li>Review application query patterns for inefficiencies</li>
                        <li>Check for connection leaks in application code</li>
                        <li>Consider increasing pool size if load is legitimate</li>
                        <li>Monitor database performance metrics</li>
                    </ol>
                </div>

                <p><em>This is an automated notification. You will not receive another alert for 24 hours.</em></p>
            </div>
            <div class="footer">
                <p>This is an automated system notification.</p>
            </div>
        </div>
    </body>
    </html>

