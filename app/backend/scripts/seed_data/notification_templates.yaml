    SYSTEM ALERT: Database connection pool utilization is high.

    Pool Status:
    - Current Utilization: {utilization_percent}
    - Connections In Use: {connections_in_use}
    - Pool Size: {pool_size}
    - Overflow Connections: {overflow}
    - Alert Threshold: {threshold_percent}
    - Detection Time: {detection_time}

    Recommended Actions:
    1. Review application query patterns for inefficiencies
    2. Check for connection leaks in application code
    3. Consider increasing pool size if load is legitimate
    4. Monitor database performance metrics

    This is an automated notification. You will not receive another alert for 24 hours.

    Best regards,
    System Operations
