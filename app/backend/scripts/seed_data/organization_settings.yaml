# Organization settings for SSO and 2FA
# Settings are keyed by organization slug

default-org:
  sso:
    sso_allowed: true
    google_enabled: false
    google_client_id: null
    google_client_secret: null
  two_factor:
    two_factor_allowed: true
    two_factor_policy: optional  # disabled, optional, mandatory
    grace_period_days: 14

test-org:
  sso:
    sso_allowed: false
    google_enabled: false
    google_client_id: null
    google_client_secret: null
  two_factor:
    two_factor_allowed: true
    two_factor_policy: disabled
    grace_period_days: 7
