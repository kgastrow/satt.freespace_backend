# System configuration defaults
# These values are seeded if they don't already exist in the database

# Cron job configuration
- key: cleanup.notifications.retention_days
  value: "90"
  description: Number of days to retain notifications before automatic cleanup

- key: cleanup.deleted_files.retention_days
  value: "30"
  description: Number of days to retain soft-deleted files before permanent deletion

- key: request_logs.retention_days
  value: "30"
  description: Number of days to retain request logs before automatic cleanup

# S3 storage monitoring configuration (no default for total_allocated_bytes - must be configured)
- key: s3_storage.warning_threshold_percent
  value: "20"
  description: Send alert when remaining storage falls below this percentage

# Disk usage monitoring configuration
- key: disk_usage.warning_threshold_percent
  value: "20"
  description: Send alert when remaining disk space falls below this percentage

- key: disk_usage.monitored_path
  value: ""
  description: Filesystem path to monitor for disk usage (empty = use LOCAL_STORAGE_PATH)

# Email configuration - platform defaults
# Note: Actual credentials should be set via API by super admin, not seeded
- key: email.default_provider
  value: "sendgrid"
  description: Default email provider for the platform (smtp or sendgrid)

- key: email.smtp.host
  value: ""
  description: Platform SMTP server host (leave empty to use config.json value)

- key: email.smtp.port
  value: "587"
  description: Platform SMTP server port

- key: email.sendgrid.enabled
  value: "true"
  description: Whether SendGrid is available as an email provider option

- key: email.sendgrid.api_key
  value: ""
  description: SendGrid API key (encrypted, set via API)

- key: email.default_sender_email
  value: ""
  description: Default sender email address (leave empty to use config.json value)

- key: email.default_sender_name
  value: ""
  description: Default sender display name for emails

# GeoIP MaxMind configuration
# Note: Actual credentials should be set via API by super admin, not seeded
- key: geoip.maxmind.account_id
  value: ""
  description: MaxMind account ID for downloading GeoIP databases

- key: geoip.maxmind.license_key
  value: ""
  description: MaxMind license key (encrypted, set via API)

- key: geoip.maxmind.edition_id
  value: "GeoLite2-City"
  description: MaxMind database edition (e.g., GeoLite2-City, GeoLite2-Country)

# S3 migration configuration
- key: s3_migration.batch_size
  value: "50"
  description: Number of files to migrate from local storage to S3 per cron run

- key: s3_migration.enabled
  value: "false"
  description: Whether automatic local-to-S3 file migration is enabled

# About page configuration
- key: about.content
  value: |
    <h2>Welcome to Our Platform</h2>
    <p>This is a multi-tenant web application template built with modern technologies.</p>
    <h3>Features</h3>
    <ul>
      <li>User authentication and authorization</li>
      <li>Multi-tenant organization support</li>
      <li>Role-based access control</li>
      <li>Real-time notifications</li>
      <li>File management</li>
    </ul>
    <h3>Contact</h3>
    <p>For support, please contact your organization administrator.</p>
  description: HTML content displayed on the About page in user settings

- key: about.content_type
  value: "html"
  description: Content type for the about page (plain or html)

# Freespace deployment settings (D13). Read through
# src/services/freespace/deployment_settings.py (60 s cache, safe defaults).
# Request-log retention (BF-73, 30 days) reuses request_logs.retention_days.
- key: freespace.limit_scope
  value: "DEVICE"
  description: "Freespace per-phone limit scope: DEVICE (cooldown/cap across all sites) or DEVICE_PER_SITE (each site's own settings) (BF-63)"

- key: freespace.cooldown_s
  value: "1800"
  description: Freespace per-phone cooldown in seconds between advisories (DEVICE scope)

- key: freespace.daily_cap
  value: "2"
  description: Freespace maximum advisories per phone per day (DEVICE scope)

- key: freespace.time_zone
  value: "Africa/Johannesburg"
  description: Freespace deployment time zone; defines "today" for the DEVICE-scope daily cap

- key: freespace.device_ceiling
  value: "50000"
  description: Freespace maximum registered devices; beyond it registration answers 503 (BF-37)

- key: freespace.retention.devices_days
  value: "90"
  description: Freespace devices with no registration update for this many days are erased (BF-73)

- key: freespace.retention.send_history_days
  value: "35"
  description: Freespace send history retention in days (BF-73)

- key: freespace.retention.events_days
  value: "365"
  description: Freespace event log retention in days (BF-73)

- key: freespace.retention.occupancy_history_days
  value: "180"
  description: Freespace occupancy history retention in days (BF-73)
