<VirtualHost *:80>
    ServerName freespace.example.com
    ServerAdmin webmaster@example.com

    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName freespace.example.com
    ServerAlias www.freespace.example.com
    ServerAdmin webmaster@example.com

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss: ws: https:;"

    # Proxy Configuration for FastAPI Backend
    ProxyPreserveHost On

    # Exclude WebSocket paths from ProxyPass (handled by RewriteRule)
    ProxyPass /ws !
    ProxyPass /api/v1/ws !

    # API routes (preserve /api/v1 prefix)
    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api

    # Proxy API docs, OpenAPI schema, and health check
    ProxyPass /docs http://127.0.0.1:8000/docs
    ProxyPassReverse /docs http://127.0.0.1:8000/docs
    ProxyPass /redoc http://127.0.0.1:8000/redoc
    ProxyPassReverse /redoc http://127.0.0.1:8000/redoc
    ProxyPass /openapi.json http://127.0.0.1:8000/openapi.json
    ProxyPassReverse /openapi.json http://127.0.0.1:8000/openapi.json
    ProxyPass /health http://127.0.0.1:8000/health
    ProxyPassReverse /health http://127.0.0.1:8000/health

    # WebSocket proxy
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/ws(.*) ws://127.0.0.1:8083/ws$1 [P,L]
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/api/v1/ws/(.*) ws://127.0.0.1:8085/api/v1/ws/$1 [P,L]

    # Serve Frontend Files (if applicable)
    DocumentRoot /var/www/freespace
    # SPA fallback: serve index.html for any route not matched by proxy or static files
    FallbackResource /index.html

    <Directory /var/www/freespace>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Enable gzip compression
        <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml
        </IfModule>
    </Directory>

    # =====================================================================
    # Cache policy
    #
    # The client-side update model (src/lib/swUpdate.ts, src/registerSW.ts,
    # src/lib/retryImport.ts) depends on exactly these three tiers. Deploying
    # that model onto looser headers reintroduces the failures each tier is
    # here to prevent, so change them together or not at all.
    #
    # If a CDN sits in front of this origin, note that a fixed "Browser Cache
    # TTL" REWRITES the Cache-Control sent to the browser for everything the
    # CDN caches (typically .js, .css, images, fonts). That silently defeats
    # `no-cache, must-revalidate` on sw.js: clients are handed a max-age
    # instead, hold a stale service worker, and that worker then serves the
    # ENTIRE app from its precache, because navigateFallback: /index.html
    # means even navigations never reach the network. `no-store` is used
    # below precisely because CDNs do not cache it, so it survives the edge.
    #
    # Section order matters: Apache merges <Location>/<LocationMatch> in
    # config-file order and the last matching `Header set` wins, so the tiers
    # below run from weakest to strongest.
    # =====================================================================

    # Tier 3 - un-hashed static files (app icons, fonts, splash screens, OG
    # images). These keep the same filename across builds, so a long TTL means
    # a replaced icon never reaches existing users. A day is long enough to
    # matter for bandwidth, short enough to stay correctable.
    #
    # Static files only. Without the `(?!api/)` guard this also matches proxied
    # backend responses whose path ends in an image extension - a served file,
    # a public avatar - relabelling a JSON 404 as cacheable for a day and a
    # short-lived signed URL as `public`. The backend owns Cache-Control for
    # everything under /api/. The status guard keeps a 404 for a missing icon
    # from being cached for a day at the edge.
    <LocationMatch "^/(?!api/).*\.(png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|mp4)$">
        Header always set Cache-Control "public, max-age=86400" "expr=%{REQUEST_STATUS} < 400"
        Header always set Cache-Control "no-store" "expr=%{REQUEST_STATUS} >= 400"
        Header always unset Expires
    </LocationMatch>

    # Tier 2 - content-hashed build output. Vite puts a content hash in every
    # /assets/ filename, so the bytes behind a URL can never change and this is
    # safe to cache forever. `immutable` also stops Safari revalidating the
    # whole asset graph on every reload.
    #
    # The status guard is load-bearing. `Header always` applies to error
    # responses too, so without it the 404 below is sent as
    # `max-age=31536000, immutable` and an edge cache stores it. A deploy that
    # unpacks file by file means a client asking for a new chunk a moment
    # before it lands gets a 404 pinned for a year, in that PoP and in its own
    # HTTP cache - and because Workbox precaches through the HTTP cache, no
    # later service worker can ever install on that device. `< 400` rather
    # than `== 200` so a 304 revalidation does not overwrite the stored
    # entry's headers with `no-store`.
    <Location "/assets/">
        Header always set Cache-Control "public, max-age=31536000, immutable" "expr=%{REQUEST_STATUS} < 400"
        Header always set Cache-Control "no-store" "expr=%{REQUEST_STATUS} >= 400"
        Header always unset Expires
        # A chunk deleted by a newer deploy must return a real 404. Without
        # this, FallbackResource answers with index.html and a 200, and the
        # browser fails on an opaque module parse error instead - with no way
        # for retryImport to tell a stale build from a broken one.
        FallbackResource disabled
    </Location>

    # Tier 1 - the files that decide which build a client runs. A stale copy of
    # any of these pins a user to an old release indefinitely, so none of them
    # may be stored by the edge, a proxy, or the browser.
    <LocationMatch "^/(index\.html|sw\.js|sw-push\.js|registerSW\.js|manifest\.webmanifest|version\.json|offline\.html)$">
        Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
        Header always set Pragma "no-cache"
        Header always unset Expires
        # A missing service worker must 404, not fall through to index.html.
        # importScripts() on an HTML body throws, which aborts installation of
        # the new worker and leaves every client stuck on the previous one -
        # the one failure mode with no client-side recovery.
        FallbackResource disabled
    </LocationMatch>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/app-error.log
    CustomLog ${APACHE_LOG_DIR}/app-access.log combined
</VirtualHost>
