# Nginx configuration for the Freespace backend (one stable public hostname).
#
# INSTALL
#   Host install:   copy to /etc/nginx/sites-available/freespace and symlink it
#                   into sites-enabled. The file is included INSIDE nginx's
#                   `http {}` block, which is why `map`, `log_format` and
#                   `upstream` appear at the top level here.
#   Docker compose: docker-compose.prod.yml mounts this file read-only, swaps
#                   the upstream address for the `api` service, and drops it
#                   into /etc/nginx/conf.d/default.conf (also inside `http {}`).
#                   Do NOT mount it as /etc/nginx/nginx.conf.
#   Full guide:     docs/freespace-deployment.md
#
# WHAT THIS PROXIES (D1)
#   /v1/      ParkIT ingest and the mobile app's endpoints (wire contract)
#   /api/     back office API (admin screens, auth, websockets)
#   /health   unauthenticated uptime check
#   Everything else is a 404 at the proxy. /mock, /metrics, /docs, /redoc and
#   /openapi.json are deliberately NOT proxied (see the commented blocks below).
#
# THE HOSTNAME IS A CONTRACT (BN-1)
#   Customer firewalls and proxies allow-list it by name. Pick it once. Replace
#   api.freespace.example.com below (every occurrence, including the certificate paths).
#
# SPLIT-ORIGIN NOTE
#   This vhost serves the API only. If the SPA is served from another origin,
#   config.json must set public_url_frontend and public_url_backend separately
#   (docs/public-url-split.md).
#
# ---------------------------------------------------------------------------
# LOG PRIVACY (BF-35, D5)
# ---------------------------------------------------------------------------
# A deviceId is a bearer secret and travels in the PATH of
# PUT/DELETE /v1/devices/<deviceId>. It must never reach a proxy log.
#
#   * Access log: the custom format below never prints $request, $request_uri
#     or $args (all of which contain the raw path). It prints $fs_log_path,
#     which the map replaces with a fixed placeholder for anything under
#     /v1/devices. The map keys on $uri (percent-decoded, slash-merged,
#     dot-segments resolved, as the backend will see it), so encoded variants
#     such as /v1/%64evices/<id> or //v1/devices/<id> are masked as well.
#   * Never logged at all: the Authorization header (ingest key), the
#     X-Freespace-App-Key header, cookies, Referer, request and response
#     bodies. Do not add $http_* variables to the format.
#   * Error log: nginx writes the full request line ("PUT /v1/devices/<id>")
#     into upstream errors (timeouts, refused connections). It cannot be
#     rewritten, so the devices location sets error_log to `emerg`, which in
#     practice means nothing about those requests is written. The cost is that
#     upstream failures on device calls are visible only as 502/504 in the
#     (masked) access log. Residual: a request rejected before any location
#     is chosen (malformed request line, TLS failure) is logged by the
#     server-level error_log at `warn`. Raise that to `crit` if you need a
#     hard guarantee, at the cost of losing upstream warnings elsewhere.
#   * Rotation: see the logrotate note in docs/freespace-deployment.md.
#
# Test the masking after any edit:  nginx -t   and the curl check in the guide.

map $uri $fs_log_path {
    default                       $uri;
    ~*^/v1/devices(/|$)           "/v1/devices/:id";
}

# Websocket upgrade support for /api (keeps upstream keepalive otherwise).
map $http_upgrade $fs_connection_upgrade {
    default   upgrade;
    ''        '';
}

log_format freespace_masked '$remote_addr [$time_iso8601] '
                            '"$request_method $fs_log_path $server_protocol" '
                            '$status $body_bytes_sent rt=$request_time '
                            'urt="$upstream_response_time" ua="$http_user_agent"';

upstream freespace_api {
    # Compose deployment: rewritten to api:8000 at container start.
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.freespace.example.com;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot -w /var/www/certbot).
    # This is the only thing port 80 serves besides the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    # Redirect HTTP to HTTPS (the access log above is masked too).
    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/freespace-http-access.log freespace_masked;
    error_log  /var/log/nginx/freespace-http-error.log warn;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.freespace.example.com;

    # TLS (BN-1). Obtain and renew with certbot; see docs/freespace-deployment.md.
    ssl_certificate /etc/letsencrypt/live/api.freespace.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.freespace.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging (masked format, see the header of this file)
    access_log /var/log/nginx/freespace-api-access.log freespace_masked;
    error_log  /var/log/nginx/freespace-api-error.log warn;

    # Client settings
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # ------------------------------------------------------------------
    # Client IP (BF-36). The application reads ONE header that this proxy
    # OVERWRITES on every request, and config.json must name it:
    #
    #     "server": { "trusted_client_ip_header": "X-Real-IP" }
    #
    # proxy_set_header replaces whatever the client sent. X-Forwarded-For is
    # also overwritten (not appended) so uvicorn's --proxy-headers fallback sees
    # a single, proxy-written value. Other headers a client could use to
    # impersonate an edge are blanked (an empty value removes the header).
    # Do not put this proxy behind another proxy/CDN without changing both
    # sides; see docs/freespace-deployment.md.
    # ------------------------------------------------------------------
    set $fs_client_ip $remote_addr;

    # Common proxy behaviour is repeated in each location because nginx does
    # not inherit proxy_set_header into a location that sets its own.

    # --- Ingest and app endpoints (wire contract) ----------------------
    # Device registration: the path carries the deviceId secret.
    location ~* ^/v1/devices(/|$) {
        # Nothing about these requests may reach the error log (see header).
        error_log /var/log/nginx/freespace-api-devices-error.log emerg;

        proxy_pass http://freespace_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fs_client_ip;
        proxy_set_header X-Forwarded-For $fs_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /v1/ {
        proxy_pass http://freespace_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fs_client_ip;
        proxy_set_header X-Forwarded-For $fs_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- Back office API -------------------------------------------------
    location /api/ {
        proxy_pass http://freespace_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fs_client_ip;
        proxy_set_header X-Forwarded-For $fs_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fs_connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # --- Uptime check (BF-80): unauthenticated, status only ---------------
    location = /health {
        proxy_pass http://freespace_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # --- Mock / demonstration mode (BF-84) -- OFF BY DEFAULT ---------------
    # /mock/* exists in the application only when freespace.mock_mode is on,
    # and production refuses to start with it unless mock_mode_acknowledged is
    # also true. Leave this block commented out on every production host. For a
    # demonstration deployment ONLY, uncomment it AND set both flags.
    #
    # location /mock/ {
    #     proxy_pass http://freespace_api;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $fs_client_ip;
    #     proxy_set_header X-Forwarded-For $fs_client_ip;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Connection "";
    # }

    # --- API documentation: development only -------------------------------
    # location ~ ^/(docs|redoc|openapi\.json)$ {
    #     proxy_pass http://freespace_api;
    #     proxy_set_header Host $host;
    # }

    # Everything else (including /metrics and /mock) is not served publicly.
    location / {
        return 404;
    }
}
