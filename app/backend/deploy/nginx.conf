# Nginx configuration for AYZER Webapp API
# Place in /etc/nginx/sites-available/ayzer-webapp-api
#
# NOTE: this vhost serves the API ONLY, on its own api.* hostname. That makes
# this a SPLIT-ORIGIN deployment, so config.json must set the two public
# origins separately (see docs/public-url-split.md):
#
#   "public_url_frontend": "https://app.ayzer-webapp.example.com"   <- the SPA
#   "public_url_backend":  "https://api.ayzer-webapp.example.com"   <- this vhost
#
# Setting only the deprecated "public_url" here would send every emailed
# password-reset, invitation and unsubscribe link to the API host, which does
# not serve the frontend bundle.

upstream ayzer_webapp_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.ayzer-webapp.example.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.ayzer-webapp.example.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/api.ayzer-webapp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ayzer-webapp.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/ayzer-webapp-api-access.log;
    error_log /var/log/nginx/ayzer-webapp-api-error.log;

    # Client settings
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Proxy settings
    location / {
        proxy_pass http://ayzer_webapp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Health check endpoint (no auth required)
    location /health {
        proxy_pass http://ayzer_webapp_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # API documentation (only in development)
    # Uncomment for development environments
    # location /docs {
    #     proxy_pass http://ayzer_webapp_api/docs;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    # }
}
